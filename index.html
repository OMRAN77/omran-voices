<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex, nofollow">
<title>أصوات عمران</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#0b0b0c; --card:#151517; --card2:#1c1b1e; --gold:#d4af37; --gold2:#f0d27a; --text:#f3efe4; --muted:#b3ab9e; --line:#2e2a22; --bad:#ff8a7a; --ok:#8fdc9a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display:flex; align-items:center; gap:12px; padding: 8px 0 16px; }
  header img { width:40px; height:40px; border-radius:10px; }
  header h1 { font-size: 22px; margin:0; color: var(--gold2); }
  header small { color: var(--muted); display:block; font-size: 13px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; color: var(--gold2); }
  label { display:block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  textarea, input[type=text], input[type=password], select {
    width:100%; background: var(--card2); color: var(--text); border:1px solid var(--line); border-radius: 12px;
    padding: 12px; font: inherit; font-size: 16px; outline: none; }
  textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
  textarea:focus, input:focus, select:focus { border-color: var(--gold); }
  .row { display:flex; gap: 10px; flex-wrap: wrap; }
  .row > .col { flex: 1 1 200px; min-width: 0; }
  .with-btn { display:flex; gap:8px; }
  .with-btn select { flex:1; min-width:0; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); padding: 11px 14px; font-size: 15px; }
  button:hover { border-color: var(--gold); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .primary { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1408; border: none; font-weight: 700; font-size: 17px; width: 100%; padding: 14px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .msg { margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
  .bar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 10px; display:none; }
  .bar > i { display:block; height:100%; width:0; background: var(--gold); transition: width .3s; }
  audio { width: 100%; margin-top: 12px; }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--gold2); font-size: 15px; }
  .slider { margin-top: 12px; } .slider input { width: 100%; accent-color: var(--gold); }
  .slider .top { display:flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .list { display:flex; flex-direction: column; gap: 8px; }
  .item { display:flex; align-items:center; gap: 8px; background: var(--card2); border:1px solid var(--line); border-radius: 12px; padding: 10px; }
  .item .t { flex: 1; min-width:0; font-size: 14px; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .t small { color: var(--muted); display:block; }
  .item button { padding: 8px 10px; font-size: 14px; }
  .rec { display:inline-block; width:10px; height:10px; border-radius:50%; background:#e0483b; margin-inline-end:6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .hidden { display:none !important; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { text-align:center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.svg" alt="">
    <div><h1>أصوات عمران</h1><small>اكتب الكلام واسمعه بأي صوت ولغة</small></div>
  </header>

  <section id="lock" class="card hidden">
    <h2>الدخول</h2>
    <label for="key">كلمة السر</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="كلمة السر">
    <div style="height:10px"></div>
    <button id="unlock" class="primary">دخول</button>
    <div id="lockMsg" class="msg bad"></div>
  </section>

  <main id="app" class="hidden">
    <section class="card">
      <h2>الكلام</h2>
      <textarea id="text" maxlength="5000" placeholder="اكتب أي كلام هني، مثلاً: هلا والله، شحالك؟"></textarea>
      <div id="count" class="meta">0 حرف</div>
      <div class="row" style="margin-top:12px">
        <div class="col">
          <label for="lang">اللغة</label>
          <select id="lang"></select>
        </div>
        <div class="col">
          <label for="voice">الصوت</label>
          <div class="with-btn">
            <select id="voice"></select>
            <button id="preview" title="اسمع الصوت" aria-label="اسمع الصوت">▶</button>
          </div>
        </div>
      </div>
      <details>
        <summary>إعدادات الصوت</summary>
        <div class="slider"><div class="top"><span>التعبير والحماس</span><b id="exV">0.5</b></div>
          <input id="ex" type="range" min="0.25" max="2" step="0.05" value="0.5"></div>
        <div class="slider"><div class="top"><span>الحيوية</span><b id="tempV">0.8</b></div>
          <input id="temp" type="range" min="0.05" max="2" step="0.05" value="0.8"></div>
        <div class="slider"><div class="top"><span>الإيقاع (أقل = أبطأ)</span><b id="cfgV">0.5</b></div>
          <input id="cfg" type="range" min="0.2" max="1" step="0.05" value="0.5"></div>
        <button id="resetSettings" style="margin-top:12px">رجّع الإعدادات الأصلية</button>
      </details>
      <div style="height:14px"></div>
      <button id="go" class="primary">حوّل لصوت</button>
      <button id="stop" class="hidden" style="width:100%;margin-top:8px">وقّف</button>
      <div class="bar" id="bar"><i></i></div>
      <div id="genMsg" class="msg"></div>
      <div id="result" class="hidden">
        <audio id="player" controls preload="auto"></audio>
        <div style="height:8px"></div>
        <button id="download" style="width:100%">نزّل الصوت</button>
      </div>
    </section>

    <section class="card">
      <h2>انسخ صوتك</h2>
      <div class="meta" style="margin:0 0 10px">تكلّم من ١٠ إلى ٢٠ ثانية بصوت واضح، في مكان هادي بدون إزعاج. لا تنسخ صوت أحد بدون موافقته.</div>
      <label for="vname">اسم الصوت</label>
      <input id="vname" type="text" maxlength="40" placeholder="مثلاً: صوتي">
      <div class="row" style="margin-top:10px">
        <button id="recBtn" class="col">🎙️ سجّل</button>
        <button id="fileBtn" class="col">📁 ارفع ملف صوت</button>
        <input id="file" type="file" accept="audio/*" class="hidden">
      </div>
      <div id="recMsg" class="msg"></div>
      <audio id="recPlayer" controls class="hidden"></audio>
      <div style="height:8px"></div>
      <button id="saveVoice" class="hidden" style="width:100%">احفظ الصوت</button>
    </section>

    <section class="card">
      <h2>أصواتي</h2>
      <div id="myVoices" class="list"></div>
    </section>

    <section class="card">
      <h2>السجل</h2>
      <div id="history" class="list"></div>
    </section>

    <footer id="foot"></footer>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
